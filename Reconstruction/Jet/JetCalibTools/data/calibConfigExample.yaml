# --------------------------------------------------------------------------------------------------------------------------------------------------------------
# Global calib tool settings - note no global properties are currently implemented
# Global:
#   SetDetectorEta: False # Switch off detector eta setting - copied from R21 but the functionality has not actually been ported (ie. this does nothing)

# --------------------------------------------------------------------------------------------------------------------------------------------------------------
# 1. Absolute JES
#AbsoluteJES:
EtaJES:

  # Used by the python function etajesStep to configure variable retrieval
  ParametrizedVars:
    varE: "e"
    varEta: "DetectorEta"

  # All entries below are direct Properties of EtaJESCalibStep :
    
  # The file with the absolute JES factors
  CalibConstantFile: JetCalibTools/CalibArea-00-04-83/CalibrationFactors/AntiKt4EMPFlow_MC23a_PreRecR22_Phase2_JES_constants.config
  # Histograme file with constant when using splines :
  HistoFile: JetCalibTools/CalibArea-00-04-83/CalibrationFactors/AntiKt4EMPFlow_MC23a_PreRecR22_Phase2_JES_calibrationFactors.root
  
  FreezeJEScorrectionatHighE: True
  LowPtJESExtrapolationMethod: 1
  MinPtForETAJES: 15
  UseSpline: True
  OutputLevel: 3
  InScale: "JetPileupScaleMomentum" # do not include in analysis-facing YAML
  OutScale: "JetEtaJESScaleMomentum" # do not include in analysis-facing YAML
  prereqs:
    default: []  

# --------------------------------------------------------------------------------------------------------------------------------------------------------------
# 2. Pile-up correction
#PileupCorrection:
Residual:
  # The config below is equivalent to the one from
  # /cvmfs/atlas.cern.ch/repo/sw/database/GroupData/JetCalibTools/CalibArea-00-04-83/CalibrationConfigs/AntiKt4EMPFlow_MC23a_PreRecR22_Phase2_CalibConfig_ResPU_EtaJES_GSC_240306_InSitu.config
  # New for rel 21 ( using OriginEventShape containers )
  #OriginCorrectedClusters: false obsolete
  # [PATCH] Specification to rho
  RhoKey: Kt4EMPFlowNeutEventShape
  # What residual jet-area offset correction to apply
  CorrectionName: ResidualOffsetMC23aFebruary2024
  #ResidualOffsetCorrection.Name:   ResidualOffsetMC23aFebruary2024

  # These corrections should correspond to the
  # conditions of the absolute JES calibration
  DefaultMuRef: 0
  DefaultNPVRef: 1
  # mu-scale factor used (only for MC)
  MuScaleFactor: 1.00
  # should the beam-spot correction be applied (only for MC)
  ApplyNPVBeamspotCorrection: 0

  # Set this to 1 to apply full 4-vector area correction
  # ApplyFullJetArea4MomentumCorrection: 0 not used in the Residual tool (this is only implemented in the simple JetArea subtraction)

  # Set this to 1 to turn off negative reco pT reset to 10 MeV during calibration
  # TurnOffNegativeReconstructedJetPtReset: 0 not used anywhere ? 

  # additional config files to include
  #ResidualOffset:
  #  CalibFile: JetCalibTools/CalibrationFactors/AntiKt4EMPFlow_MC23a_PreRecR22_Phase2_ResidualPileUp_20240205.config
  # For now directly including the values here : 
  AbsEtaBins: [0.000, 0.100, 0.200, 0.300, 0.400, 0.500, 0.600, 0.700, 0.800, 0.900, 1.000, 1.100, 1.200, 1.300, 1.400, 1.500, 1.600, 1.700, 1.800, 1.900, 2.000, 2.100, 2.200, 2.300, 2.400, 2.500, 2.600, 2.700, 2.800, 2.900, 3.000, 3.100, 3.200, 3.300, 3.400, 3.500, 3.600, 3.800, 4.000, 4.200, 4.500, 4.900]
  
  MuTerm: [-0.008, -0.059, 0.046, -0.095, 0.096, -0.048, -0.015, -0.016, 0.040, -0.097, 0.065, -0.120, 0.058, -0.110, 0.084, 0.023, -0.106, -0.041, -0.123, 0.096, -0.353, 0.290, -0.352, 0.344, -0.558, 0.185, -0.508, -0.234, -0.234, -0.034, -0.089, 0.293, 0.200, 0.147, -0.070, -0.180, -0.269, -0.147, -0.128, -0.085, 0.076, 0.304]

  NPVTerm: [0.024, 0.233, -0.196, 0.285, -0.250, 0.126, -0.029, 0.023, -0.144, 0.205, 0.002, 0.113, 0.080, 0.004, -0.060, 0.026, 0.013, 0.041, 0.165, -0.051, 0.445, -0.343, 0.373, -0.503, 0.810, -0.042, 0.741, 0.405, 0.405, 0.266, -0.084, -0.490, -0.471, -0.340, 0.036, 0.324, 0.443, 0.235, 0.207, 0.163, -0.159, -0.616]

  CorrectionDesc: "MC20 residual mu and NPV pileup corrections for R=0.4 AntiKt4EMPFlowJets. October 22."
  DoJetArea: True
  
  InScale: "JetConstitScaleMomentum" # do not include in analysis-facing YAML
  OutScale: "JetPileupScaleMomentum" # do not include in analysis-facing YAML
  prereqs:
    default: []
  
# --------------------------------------------------------------------------------------------------------------------------------------------------------------
# 3. Global sequential calibration
GSC:
  fileGSC: 'JetCalibTools/CalibArea-00-04-83/CalibrationFactors/AntiKt4EMPFlow_MC23a_PreRecR22_Phase2_GSC_calibrationFactors_240306.root'
  histTool_EM3:
    N_hist: 35 # could we read this automatically from the histogram? Ideally this would just be a 3D histogram...
    histNameBase: "AntiKt4EMPFlow_EM3_interpolation_resp_eta"
  histTool_CharFrac:
    N_hist: 25
    histNameBase: "AntiKt4EMPFlow_chargedFraction_interpolation_resp_eta"
  histTool_Tile0:
    N_hist: 18
    histNameBase: "AntiKt4EMPFlow_Tile0_interpolation_resp_eta"
  histTool_nTrk:
    N_hist: 25
    histNameBase: "AntiKt4EMPFlow_nTrk_interpolation_resp_eta"
  histTool_trackWIDTH:
    N_hist: 25
    histNameBase: "AntiKt4EMPFlow_trackWIDTH_interpolation_resp_eta"
  InScale: "JetEtaJESScaleMomentum" # do not include in analysis-facing YAML
  OutScale: "JetGSCScaleMomentum" # do not include in analysis-facing YAML
  prereqs:
    default:
      - mod:CaloEnergies
      - mod:TrackMoments
      - ghost:MuonSegment
    TrigRun2:
      - mod:CaloEnergies
  
# ----------------
# 5. Time-Dependent Insitu Calibration
Insitu:
  fileInsitu: 
    - 'JetCalibTools/CalibArea-00-04-82/InsituCalibration/InsituCalibration_80ifb_1516_Nov_2018_4PF_Consolidated.root'
    - 'JetCalibTools/CalibArea-00-04-82/InsituCalibration/InsituCalibration_80ifb_17_Nov_2018_4PF_Consolidated.root'
  histEtaInterCalib:
    histName: 'AntiKt4EMPFlow_EtaInterCalibration'
    varX: 'pt'
    varY: 'eta'
  histAbsCalib:
    histName: 'AntiKt4EMPFlow_InsituCalib'
    varX: 'pt'
  RunNumbers: [251102, 314199, 999999]
  CalibrateMC: True
  InScale: "JetGSCScaleMomentum" # do not include in analysis-facing YAML
  OutScale: "JetInsituScaleMomentum" # do not include in analysis-facing YAML
  prereqs:
    default: []
  # noRun: True
