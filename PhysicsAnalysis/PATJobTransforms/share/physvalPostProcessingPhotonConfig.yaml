efficiencies:
  ######################################### All Photon Efficiencies ##########################################
  # ─────────────────────────────────────────────────────────────────────
  # 1. RECO EFFICIENCY: How efficiently truth-level particles are reconstructed?
  #     Efficiency = Reco / Truth
  # ─────────────────────────────────────────────────────────────────────
  - {numerator: "Photon/Truth/Reco/all/Photon_Truth_Reco_all_et", denominator: "Photon/Truth/Iso/all/Photon_Truth_Iso_all_et", output: "Photon/Efficiency/Efficiency_reco_only_et"}
  - {numerator: "Photon/Truth/Reco/all/Photon_Truth_Reco_all_eta", denominator: "Photon/Truth/Iso/all/Photon_Truth_Iso_all_eta", output: "Photon/Efficiency/Efficiency_reco_only_eta"}
  # ─────────────────────────────────────────────────────────────────────
  # 2. ID EFFICIENCY OVER TRUTH: How efficiently truth-level particles pass ID (LH) selections?
  #     Efficiency = ID(LHLoose/Medium/Tight) / Truth
  # ─────────────────────────────────────────────────────────────────────
  - {numerator: "Photon/Truth/RecoLoose/all/Photon_Truth_RecoLoose_all_et", denominator: "Photon/Truth/Iso/all/Photon_Truth_Iso_all_et", output: "Photon/Efficiency/Efficiency_Loose_over_true_et"}
  - {numerator: "Photon/Truth/RecoLoose/all/Photon_Truth_RecoLoose_all_eta", denominator: "Photon/Truth/Iso/all/Photon_Truth_Iso_all_eta", output: "Photon/Efficiency/Efficiency_Loose_over_true_eta"}
  - {numerator: "Photon/Truth/RecoTight/all/Photon_Truth_RecoTight_all_et", denominator: "Photon/Truth/Iso/all/Photon_Truth_Iso_all_et", output: "Photon/Efficiency/Efficiency_Tight_over_true_et"}
  - {numerator: "Photon/Truth/RecoTight/all/Photon_Truth_RecoTight_all_eta", denominator: "Photon/Truth/Iso/all/Photon_Truth_Iso_all_eta", output: "Photon/Efficiency/Efficiency_Tight_over_true_eta"}
  # ─────────────────────────────────────────────────────────────────────
  # 3. ID EFFICIENCY OVER RECO: Among reconstructed particles, how many pass ID (LH) selections?
  #     Efficiency = ID(LHLoose/Medium/Tight) / Reco
  # # ─────────────────────────────────────────────────────────────────────
