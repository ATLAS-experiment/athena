  - {numerator: "Photon/Truth/RecoLoose/all/Photon_Truth_RecoLoose_all_eta", denominator: "Photon/Truth/Reco/all/Photon_Truth_Reco_all_eta", output: "Photon/Efficiency/Efficiency_Loose_over_reco_eta"}
  - {numerator: "Photon/Truth/RecoTight/all/Photon_Truth_RecoTight_all_et", denominator: "Photon/Truth/Reco/all/Photon_Truth_Reco_all_et", output: "Photon/Efficiency/Efficiency_Tight_over_reco_et"}
