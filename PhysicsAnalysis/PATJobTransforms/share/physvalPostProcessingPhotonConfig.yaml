  - {numerator: "Photon/Truth/RecoTight/Conv/Photon_Truth_RecoTight_Conv_eta", denominator: "Photon/Truth/Reco/Conv/Photon_Truth_Reco_Conv_eta", output: "Photon/Efficiency/Efficiency_Conv_Tight_over_reco_eta"}
