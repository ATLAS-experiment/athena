# ROC curve: b-jet efficiency (true positive rate) on the x-axis vs. light-jet rejection (inverse of false positive rate) on the y-axis.
# It tells how well a tagger can separate b-jets (signal) from light-flavor jets (background).
roc_curves:
  # Signal: b-jets, Background: u/light-jets (main b vs light ROC)
  - {signal: "BTag/AntiKt4EMPFlowJets/BTag_AntiKt4EMPFlowJets_tagger_GN2v01_b_matched_weight", background: "BTag/AntiKt4EMPFlowJets/BTag_AntiKt4EMPFlowJets_tagger_GN2v01_u_matched_weight", output: "BTag/ROC/GN2v01"}
  - {signal: "BTag/AntiKt10UFOCSSKSoftDropBeta100Zcut10Jets/BTag_AntiKt10UFOCSSKSoftDropBeta100Zcut10Jets_tagger_GN3XPV01_b_matched_weight", background: "BTag/AntiKt10UFOCSSKSoftDropBeta100Zcut10Jets/BTag_AntiKt10UFOCSSKSoftDropBeta100Zcut10Jets_tagger_GN3XPV01_u_matched_weight", output: "BTag/ROC/GN3XPV01"}

  # Signal: b-jets, Background: Charm (c) jets (c vs b rejection ROC)
  - {signal: "BTag/AntiKt4EMPFlowJets/BTag_AntiKt4EMPFlowJets_tagger_GN2v01_b_matched_weight", background: "BTag/AntiKt4EMPFlowJets/BTag_AntiKt4EMPFlowJets_tagger_GN2v01_c_matched_weight", output: "BTag/ROC/GN2v01_cVsb"}
  - {signal: "BTag/AntiKt10UFOCSSKSoftDropBeta100Zcut10Jets/BTag_AntiKt10UFOCSSKSoftDropBeta100Zcut10Jets_tagger_GN3XPV01_b_matched_weight", background: "BTag/AntiKt10UFOCSSKSoftDropBeta100Zcut10Jets/BTag_AntiKt10UFOCSSKSoftDropBeta100Zcut10Jets_tagger_GN3XPV01_c_matched_weight", output: "BTag/ROC/GN3XPV01_cVsb"}

