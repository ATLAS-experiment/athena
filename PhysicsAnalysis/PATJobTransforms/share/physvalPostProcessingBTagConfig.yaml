# ROC curve: b-jet efficiency (true positive rate) on the x-axis vs. light-jet rejection (inverse of false positive rate) on the y-axis.
# It tells how well a tagger can separate b-jets (signal) from light-flavor jets (background).
roc_curves:
  # Signal: b-jets, Background: u/light-jets (main b vs light ROC)
  - {signal: "BTag/AntiKt4EMPFlowJets/BTag_AntiKt4EMPFlowJets_tagger_IP3D_b_matched_weight", background: "BTag/AntiKt4EMPFlowJets/BTag_AntiKt4EMPFlowJets_tagger_IP3D_u_matched_weight", output: "BTag/ROC/IP3D"}
  - {signal: "BTag/AntiKt4EMPFlowJets/BTag_AntiKt4EMPFlowJets_tagger_DIPS_b_matched_weight", background: "BTag/AntiKt4EMPFlowJets/BTag_AntiKt4EMPFlowJets_tagger_DIPS_u_matched_weight", output: "BTag/ROC/DIPS"}
  - {signal: "BTag/AntiKt4EMPFlowJets/BTag_AntiKt4EMPFlowJets_tagger_SV1_b_matched_weight", background: "BTag/AntiKt4EMPFlowJets/BTag_AntiKt4EMPFlowJets_tagger_SV1_u_matched_weight", output: "BTag/ROC/SV1"}
  - {signal: "BTag/AntiKt4EMPFlowJets/BTag_AntiKt4EMPFlowJets_tagger_DL1dv01_b_matched_weight", background: "BTag/AntiKt4EMPFlowJets/BTag_AntiKt4EMPFlowJets_tagger_DL1dv01_u_matched_weight", output: "BTag/ROC/DL1dv01"}
