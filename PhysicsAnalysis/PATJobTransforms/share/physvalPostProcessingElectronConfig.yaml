efficiencies:
  # ─────────────────────────────────────────────────────────────────────
  # 1. RECO EFFICIENCY: How efficiently truth-level particles are reconstructed?
  #     Efficiency = Reco / Truth
  # ─────────────────────────────────────────────────────────────────────
  - {numerator: "Electron/Central/Iso/KinPlots/Electron_Central_Iso_KinPlots_eta", denominator: "Electron/Truth/Iso/Electron_Truth_Iso_eta", output: "Electron/Efficiency/Efficiency_reco_only_eta"}
  - {numerator: "Electron/Central/Iso/KinPlots/Electron_Central_Iso_KinPlots_et", denominator: "Electron/Truth/Iso/Electron_Truth_Iso_et", output: "Electron/Efficiency/Efficiency_reco_only_et"}

  # ─────────────────────────────────────────────────────────────────────
  # 2. ID EFFICIENCY OVER TRUTH: How efficiently truth-level particles pass ID (LH) selections?
  #     Efficiency = ID(LHLoose/Medium/Tight) / Truth
  # ─────────────────────────────────────────────────────────────────────
  - {numerator: "Electron/Central/IsoLHLoose/KinPlots/Electron_Central_IsoLHLoose_KinPlots_eta", denominator: "Electron/Truth/Iso/Electron_Truth_Iso_eta", output: "Electron/Efficiency/Efficiency_LHLoose_over_true_eta"}
  - {numerator: "Electron/Central/IsoLHLoose/KinPlots/Electron_Central_IsoLHLoose_KinPlots_et", denominator: "Electron/Truth/Iso/Electron_Truth_Iso_et", output: "Electron/Efficiency/Efficiency_LHLoose_over_true_et"}
  - {numerator: "Electron/Central/IsoLHMedium/KinPlots/Electron_Central_IsoLHMedium_KinPlots_eta", denominator: "Electron/Truth/Iso/Electron_Truth_Iso_eta", output: "Electron/Efficiency/Efficiency_LHMedium_over_true_eta"}
  - {numerator: "Electron/Central/IsoLHMedium/KinPlots/Electron_Central_IsoLHMedium_KinPlots_et", denominator: "Electron/Truth/Iso/Electron_Truth_Iso_et", output: "Electron/Efficiency/Efficiency_LHMedium_over_true_et"}
  - {numerator: "Electron/Central/IsoLHTight/KinPlots/Electron_Central_IsoLHTight_KinPlots_eta", denominator: "Electron/Truth/Iso/Electron_Truth_Iso_eta", output: "Electron/Efficiency/Efficiency_LHTight_over_true_eta"}
  - {numerator: "Electron/Central/IsoLHTight/KinPlots/Electron_Central_IsoLHTight_KinPlots_et", denominator: "Electron/Truth/Iso/Electron_Truth_Iso_et", output: "Electron/Efficiency/Efficiency_LHTight_over_true_et"}
  # ─────────────────────────────────────────────────────────────────────
  # 3. ID EFFICIENCY OVER RECO: Among reconstructed particles, how many pass ID (LH) selections?
  #     Efficiency = ID(LHLoose/Medium/Tight) / Reco
  # # ─────────────────────────────────────────────────────────────────────
  - {numerator: "Electron/Central/IsoLHLoose/KinPlots/Electron_Central_IsoLHLoose_KinPlots_eta", denominator: "Electron/Central/Iso/KinPlots/Electron_Central_Iso_KinPlots_eta", output: "Electron/Efficiency/Efficiency_LHLoose_over_reco_eta"}
  - {numerator: "Electron/Central/IsoLHLoose/KinPlots/Electron_Central_IsoLHLoose_KinPlots_et", denominator: "Electron/Central/Iso/KinPlots/Electron_Central_Iso_KinPlots_et", output: "Electron/Efficiency/Efficiency_LHLoose_over_reco_et"}
  - {numerator: "Electron/Central/IsoLHMedium/KinPlots/Electron_Central_IsoLHMedium_KinPlots_eta", denominator: "Electron/Central/Iso/KinPlots/Electron_Central_Iso_KinPlots_eta", output: "Electron/Efficiency/Efficiency_LHMedium_over_reco_eta"}
  - {numerator: "Electron/Central/IsoLHMedium/KinPlots/Electron_Central_IsoLHMedium_KinPlots_et", denominator: "Electron/Central/Iso/KinPlots/Electron_Central_Iso_KinPlots_et", output: "Electron/Efficiency/Efficiency_LHMedium_over_reco_et"}
  - {numerator: "Electron/Central/IsoLHTight/KinPlots/Electron_Central_IsoLHTight_KinPlots_eta", denominator: "Electron/Central/Iso/KinPlots/Electron_Central_Iso_KinPlots_eta", output: "Electron/Efficiency/Efficiency_LHTight_over_reco_eta"}
  - {numerator: "Electron/Central/IsoLHTight/KinPlots/Electron_Central_IsoLHTight_KinPlots_et", denominator: "Electron/Central/Iso/KinPlots/Electron_Central_Iso_KinPlots_et", output: "Electron/Efficiency/Efficiency_LHTight_over_reco_et"}

