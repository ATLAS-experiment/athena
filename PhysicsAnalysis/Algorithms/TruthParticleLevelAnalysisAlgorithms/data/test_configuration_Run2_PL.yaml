CommonServices:
  systematicsHistogram: systematicsList

GeneratorLevelAnalysis: {}

PL_Electrons:
  containerName: TruthElectrons
  saveUID: true
  PtEtaSelection:
    useDressedProperties: true
    minPt: 20000.0
  MCTCClassification:
    prefix: ""
PL_Photons:
  containerName: TruthPhotons
  saveUID: true
  PtEtaSelection:
    minPt: 20000.0
PL_Muons:
  containerName: TruthMuons
  saveUID: true
  PtEtaSelection:
    useDressedProperties: true
    minPt: 20000.0
  MCTCClassification:
    prefix: ""
PL_Taus:
  containerName: TruthTaus
  saveUID: true
  PtEtaSelection:
    minPt: 20000.0
  MCTCClassification:
    prefix: ""
PL_Jets:
  containerName: AntiKt4TruthDressedWZJets
  PtEtaSelection:
    minPt: 20000.0
PL_Neutrinos: {}
PL_MissingET: {}
PL_OverlapRemoval:
  electrons: TruthElectrons
  muons: TruthMuons
  photons: TruthPhotons
  jets: AntiKt4TruthDressedWZJets
  useRapidityForDeltaR: False

# After configuring each container, many variables will be saved automatically.
Output:
  treeName: analysis
  truthMetVars:
    - TruthMET_NOSYS.met -> truth_met type=float
  containersOnlyForMC:
    truth_mu_: TruthMuons
    truth_el_: TruthElectrons
    truth_ph_: TruthPhotons
    truth_tau_: TruthTaus
    truth_jet_: AntiKt4TruthDressedWZJets
    truth_met_: TruthMET

PrintConfiguration: {}
