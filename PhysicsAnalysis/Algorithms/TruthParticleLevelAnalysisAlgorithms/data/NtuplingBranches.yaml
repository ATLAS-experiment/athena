ParticleLevelElectronsBlock:
  - name: pt
    description: dressed $p_\mathrm{T}$ (no systematics)
  - name: eta
    description: dressed $\eta$ (no systematics)
  - name: phi
    description: dressed $\phi$ (no systematics)
  - name: e
    description: dressed $E$ (no systematics)
  - name: charge
    description: charge (no systematics)
  - name: type
    description: particle type according to the [`MCTruthClassifier`](https://acode-browser1.usatlas.bnl.gov/lxr/source/athena/PhysicsAnalysis/MCTruthClassifier/MCTruthClassifier/MCTruthClassifierDefs.h) (no systematics)
  - name: origin
    description: particle origin according to the [`MCTruthClassifier`](https://acode-browser1.usatlas.bnl.gov/lxr/source/athena/PhysicsAnalysis/MCTruthClassifier/MCTruthClassifier/MCTruthClassifierDefs.h) (no systematics)
  - name: uid
    description: the original ID from HepMC (no systematics)
    toggled_by: saveUID

