PreJetAnalysisConfig:
  - name: pt
    description: jet $p_\mathrm{T}$
  - name: eta
    description: jet $\eta$ (no systematics)
  - name: phi
    description: jet $\phi$ (no systematics)
  - name: HadronConeExclTruthLabelID
    description: truth labels used by the FTAG group (no systematics)
    toggled_by: outputTruthLabelIDs
  - name: PartonTruthLabelID
    description: PDG identification of the highest-energy ghost-associated parton (no systematics)
    toggled_by: outputTruthLabelIDs

SmallRJetAnalysisConfig:
  - name: jvtEfficiency
    description: the per-jet JVT efficiency SF
  - name: select_baselineJvt
    description: the per-jet selection flag for baseline selection and JVT
  - name: fjvtEfficiency
    description: the per-jet fJVT efficiency SF
    toggled_by: runFJvtEfficiency
  - name: select_baselineFJvt
    description: the per-jet selection flag for baseline selection and forward JVT
    toggled_by: runFJvtEfficiency

LargeRJetAnalysisConfig:
  - name: m
    description: jet mass

JetJvtAnalysisConfig:
  - name: weight_jvt_effSF
    description: the event-level JVT efficiency SF
  - name: weight_fjvt_effSF
    description: the event-level forward JVT efficiency SF

JetUncertaintiesConfig:
  - name: Njet
    description: jet multiplicity for custom jet flavour composition uncertainties
    toggled_by: analysisJetSelection
  - name: e
    description: jet $E$ (*since AnalysisBase 25.2.13*)

JetReclusteringBlock:
  - name: pt
    description: reclustered jet $p_\mathrm{T}$
  - name: eta
    description: reclustered jet $\eta$
  - name: phi
    description: reclustered jet $\phi$
  - name: e
    description: reclustered jet $E$
  - name: small_r_jet_indices
    description: vector of indices of the small-R jets clustered into this large-R jet

ReclusteredJetCalibrationBlock:
  - name: pt
    description: reclustered jet $p_\mathrm{T}$
  - name: eta
    description: reclustered jet $\eta$
  - name: phi
    description: reclustered jet $\phi$
  - name: m
    description: reclustered jet invariant mass

