CommonServices:
  systematicsHistogram: systematicsList

PileupReweighting: {}

EventCleaning:
  runEventCleaning: True

Jets:
- containerName: AnaJets
  jetCollection: AntiKt4EMPFlowJets
  runJvtUpdate: False
  runNNJvtUpdate: True
  runJvtSelection: False # deprecated, done via JVTWorkingPoint block now
  recalibratePhyslite: False
  JVTWorkingPoint:
    - selectionName: baselineJvt
      jvtWP: FixedEffPt
  FlavourTagging:
  - selectionName: ftag
    btagger: GN2v01
    btagWP: FixedCutBEff_65
    saveScores: All
  FlavourTaggingEventSF:
  - containerName: AnaJets.baselineJvt
    btagger: GN2v01
  TriggerMatching:
  - runL1Matching: True
    runHLTMatching: True
    triggerChainsPerYear:
      2016:
        - HLT_2j35_bmv2c2060_split_2j35_L14J15.0ETA25
      2017:
        - HLT_2j15_gsc35_bmv2c1040_split_2j15_gsc35_boffperf_split_L14J15.0ETA25
      2018:
        - HLT_2j35_bmv2c1060_split_2j35_L14J15.0ETA25
- containerName: AnaLargeRJets
  jetCollection: AntiKt10UFOCSSKSoftDropBeta100Zcut10Jets
  recalibratePhyslite: False

ObjectCutFlow:
- containerName: AnaJets
  selectionName: jvt

GeneratorLevelAnalysis: {}

PrintConfiguration: {}
