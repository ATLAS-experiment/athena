CommonServices:
  systematicsHistogram: systematicsList

PileupReweighting: {}

EventCleaning:
  runEventCleaning: True

Muons:
- containerName: AnaMuons
  recalibratePhyslite: False
  decorateTruth: true
  writeTrackD0Z0: True
  WorkingPoint:
  - selectionName: tight
    quality: Tight
    isolation: PflowLoose_VarRad
  - selectionName: medium
    quality: Medium
    isolation: PflowTight_VarRad
  - selectionName: loose
    quality: Loose
    isolation: Loose_VarRad
  - selectionName: lowpt
    quality: LowPt
    isolation: Tight_VarRad
  - selectionName: highpt
    quality: HighPt
    isolation: NonIso
  IFFClassification: {}
  MCTCClassification:
    prefix: truth_
  TriggerSF:
    triggerChainsPerYear:
      '2015':
      - 'HLT_mu20_iloose_L1MU15 || HLT_mu40'
      '2016':
      - 'HLT_mu26_ivarmedium || HLT_mu50'
      '2017':
      - 'HLT_mu50'
      '2018':
      - 'HLT_mu26_ivarmedium'
      - 'HLT_2mu14'
    muonID: 'Tight'

GeneratorLevelAnalysis: {}

PrintConfiguration: {}
