CommonServices:
  systematicsHistogram: systematicsList

PileupReweighting: {}

EventCleaning:
  runEventCleaning: True

Muons:
- containerName: AnaMuons
  recalibratePhyslite: False
  decorateTruth: true
  writeTrackD0Z0: True
  WorkingPoint:
  - selectionName: tight
    quality: Tight
    isolation: PflowLoose_VarRad
  - selectionName: medium
    quality: Medium
    isolation: PflowTight_VarRad
  - selectionName: loose
    quality: Loose
    isolation: Loose_VarRad
  - selectionName: lowpt
    quality: LowPt
    isolation: Tight_VarRad
  - selectionName: highpt
    quality: HighPt
    isolation: NonIso
  IFFClassification: {}
  MCTCClassification:
    prefix: truth_
  TriggerSF:
    triggerChainsPerYear:
      '2022':
      - 'HLT_mu24_ivarmedium_L1MU14FCH || HLT_mu50_L1MU14FCH'
    muonID: 'Tight'

GeneratorLevelAnalysis: {}

PrintConfiguration: {}
