CommonServices:
    systematicsHistogram: 'systematicsList'
    filterSystematics: '^(?:(?!PseudoData).)*$'

PileupReweighting: {}

EventCleaning:
    runEventCleaning: True

Jets:
  - containerName: 'AnaJets'
    jetCollection: 'AntiKt4EMPFlowJets'
    runJvtUpdate: False
    runNNJvtUpdate: True
    FlavourTagging:
      - selectionName: 'ftag'
        noEffSF: True
        btagger: 'GN2v01'
        btagWP: 'FixedCutBEff_65'
    JVT: {}
    PtEtaSelection: {}
  - containerName: 'AnaLargeRJets'
    jetCollection: 'AntiKt10UFOCSSKSoftDropBeta100Zcut10Jets'
    PtEtaSelection: {}

Electrons:
  - containerName: 'AnaElectrons'
    forceFullSimConfig: True
    WorkingPoint:
      - selectionName: 'loose'
        forceFullSimConfig: True
        noEffSF: True
        identificationWP: 'LooseBLayerLH'
        isolationWP: 'Loose_VarRad'
        writeTrackD0Z0: True

    PtEtaSelection:
        minPt: 10000.0

Photons:
  - containerName: 'AnaPhotons'
    recomputeIsEM: False
    forceFullSimConfig: True
    WorkingPoint:
      - selectionName: 'tight'
        forceFullSimConfig: True
        noEffSF: True
        qualityWP: 'Tight'
        isolationWP: 'FixedCutTight'
        recomputeIsEM: False
    PtEtaSelection:
        minPt: 10000.0

Muons:
  - containerName: 'AnaMuons'
    WorkingPoint:
      - selectionName: 'medium'
        quality: 'Medium'
        isolation: 'Loose_VarRad'
        onlyRecoEffSF: True
        writeTrackD0Z0: True
    PtEtaSelection: {}

TauJets:
  - containerName: 'AnaTauJets'
    WorkingPoint:
      - selectionName: 'tight'
        quality: 'Tight'
    PtEtaSelection: {}

SystObjectLink:
  - containerName: 'AnaJets'
  - containerName: 'AnaLargeRJets'
  - containerName: 'AnaElectrons'
  - containerName: 'AnaPhotons'
  - containerName: 'AnaMuons'
  - containerName: 'AnaTauJets'

ObjectCutFlow:
  - containerName: 'AnaJets'
    selectionName: 'jvt'
  - containerName: 'AnaElectrons'
    selectionName: 'loose'
  - containerName: 'AnaPhotons'
    selectionName: 'tight'
  - containerName: 'AnaMuons'
    selectionName: 'medium'
  - containerName: 'AnaTauJets'
    selectionName: 'tight'

GeneratorLevelAnalysis:
  - saveCutBookkeepers: True
    runNumber: 284500
    cutBookkeepersSystematics: True

# containerName and selectionName must be defined in their respective blocks
MissingET:
  - containerName: 'AnaMET'
    # Format should follow Object: '<containerName>.<selectionName>'
    jets: 'AnaJets'
    taus: 'AnaTauJets.tight'
    electrons: 'AnaElectrons.loose'
    photons: 'AnaPhotons.tight'
    muons: 'AnaMuons.medium'

# containerName and selectionName must be defined in their respective blocks
OverlapRemoval:
    inputLabel: 'preselectOR'
    outputLabel: 'passesOR'
    # Format should follow Object: '<containerName>.<selectionName>'
    jets: 'AnaJets'
    taus: 'AnaTauJets.tight'
    electrons: 'AnaElectrons.loose'
    photons: 'AnaPhotons.tight'
    muons: 'AnaMuons.medium'

Thinning:
  - containerName: 'AnaElectrons'
    outputName: 'OutElectrons'
    selectionName: 'loose'
  - containerName: 'AnaPhotons'
    outputName: 'OutPhotons'
    selectionName: 'tight'
  - containerName: 'AnaMuons'
    outputName: 'OutMuons'
    selectionName: 'medium'
  - containerName: 'AnaTauJets'
    outputName: 'OutTauJets'
    selectionName: 'tight'
  - containerName: 'AnaJets'
    outputName: 'OutJets'
  - containerName: 'AnaLargeRJets'
    outputName: 'OutLargeRJets'

# After configuring each container, many variables will be saved automatically.
Output:
    treeName: 'analysis'
    vars: []
    metVars: []
    containers:
        # Format should follow: '<suffix>:<output container>'
        mu_: 'OutMuons'
        el_: 'OutElectrons'
        ph_: 'OutPhotons'
        tau_: 'OutTauJets'
        jet_: 'OutJets'
        larger_jet_: 'OutLargeRJets'
        met_: 'AnaMET'
        '': 'EventInfo'
    commands:
      - 'disable jet_select_baselineJvt.*'
      - 'disable mu_select_medium.*'
      - 'disable el_select_loose.*'
      - 'disable ph_select_tight.*'
      - 'disable tau_select_tight.*'
