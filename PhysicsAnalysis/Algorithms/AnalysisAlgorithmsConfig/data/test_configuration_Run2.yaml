CommonServices:
  systematicsHistogram: systematicsList

PileupReweighting: {}

EventCleaning:
  runEventCleaning: True

Jets:
  - containerName: AnaJets
    jetCollection: AntiKt4EMPFlowJets
    runJvtUpdate: False
    runNNJvtUpdate: True
    recalibratePhyslite: False
    FlavourTagging:
      - selectionName: ftag
        noEffSF: True
        btagger: GN2v01
        btagWP: FixedCutBEff_65
      - btagger: GN2v01
        btagWP: Continuous
        saveScores: All
    FlavourTaggingEventSF:
      - containerName: AnaJets.baselineJvt
        btagger: GN2v01
        btagWP: Continuous
    JVT: {}
  - containerName: AnaLargeRJets
    jetCollection: AntiKt10UFOCSSKSoftDropBeta100Zcut10Jets
    recalibratePhyslite: False

Electrons:
  - containerName: AnaElectrons
    forceFullSimConfig: True
    recalibratePhyslite: False
    decorateTruth: true
    WorkingPoint:
      - selectionName: loose
        forceFullSimConfig: True
        noEffSF: True
        identificationWP: LooseBLayerLH
        isolationWP: Loose_VarRad
        writeTrackD0Z0: True
    PtEtaSelection:
      minPt: 10000.0

Photons:
  - containerName: AnaPhotons
    recomputeIsEM: False
    forceFullSimConfig: True
    recalibratePhyslite: False
    decorateTruth: true
    WorkingPoint:
      - selectionName: tight
        forceFullSimConfig: True
        qualityWP: Tight
        isolationWP: FixedCutTight
        recomputeIsEM: False
    PtEtaSelection:
      minPt: 10000.0

Muons:
  - containerName: AnaMuons
    recalibratePhyslite: False
    decorateTruth: true
    WorkingPoint:
      - selectionName: medium
        quality: Medium
        isolation: Loose_VarRad
        writeTrackD0Z0: True

TauJets:
  - containerName: AnaTauJets
    decorateTruth: true
    WorkingPoint:
      - selectionName: tight
        quality: Tight
    TriggerSF:
      - tauID: Tight
        triggerChainsPerYear:
          2015:
            - HLT_tau25_medium1_tracktwo
            - HLT_tau35_medium1_tracktwo
          2016:
            - HLT_tau25_medium1_tracktwo
            - HLT_tau35_medium1_tracktwo
          2017:
            - HLT_tau25_medium1_tracktwo
            - HLT_tau35_medium1_tracktwo
          2018:
            - HLT_tau25_medium1_tracktwoEF_OR_mediumRNN_tracktwoMVA
            - HLT_tau35_medium1_tracktwoEF_OR_mediumRNN_tracktwoMVA

SystObjectLink:
  - containerName: AnaJets
  - containerName: AnaLargeRJets
  - containerName: AnaElectrons
  - containerName: AnaPhotons
  - containerName: AnaMuons
  - containerName: AnaTauJets

ObjectCutFlow:
  - containerName: AnaJets
    selectionName: jvt
  - containerName: AnaElectrons
    selectionName: loose
  - containerName: AnaPhotons
    selectionName: tight
  - containerName: AnaMuons
    selectionName: medium
  - containerName: AnaTauJets
    selectionName: tight

GeneratorLevelAnalysis: {}

# containerName and selectionName must be defined in their respective blocks
MissingET:
  - containerName: AnaMET
    # Format should follow Object: <containerName>.<selectionName>
    jets: AnaJets
    taus: AnaTauJets.tight
    electrons: AnaElectrons.loose
    photons: AnaPhotons.tight
    muons: AnaMuons.medium

# containerName and selectionName must be defined in their respective blocks
OverlapRemoval:
  inputLabel: preselectOR
  outputLabel: passesOR
  # Format should follow Object: <containerName>.<selectionName>
  jets: AnaJets.baselineJvt
  taus: AnaTauJets.tight
  electrons: AnaElectrons.loose
  photons: AnaPhotons.tight
  muons: AnaMuons.medium

Thinning:
  - containerName: AnaElectrons
    outputName: OutElectrons
    selectionName: loose
  - containerName: AnaPhotons
    outputName: OutPhotons
    selectionName: tight
  - containerName: AnaMuons
    outputName: OutMuons
    selectionName: medium
  - containerName: AnaTauJets
    outputName: OutTauJets
    selectionName: tight
  - containerName: AnaJets
    outputName: OutJets
  - containerName: AnaLargeRJets
    outputName: OutLargeRJets

EventSelection:
  - electrons: AnaElectrons.loose
    muons: AnaMuons.medium
    jets: AnaJets.baselineJvt
    met: AnaMET
    btagDecoration: ftag_select_ftag
    noFilter: True
    cutFlowHistograms: True
    selectionCutsDict:
      SUBcommon: |
        JET_N_BTAG >= 2
        JET_N 25000 >= 4
        MET >= 20000
        SAVE
      ejets: |
        IMPORT SUBcommon
        EL_N 5000 == 1
        MU_N 3000 == 0
        MWT < 170000
        MET+MWT > 40000
        SAVE
      mujets: |
        IMPORT SUBcommon
        EL_N 5000 == 0
        MU_N medium 25000 > 0
        SAVE

Trigger:
  triggerChainsPerYear:
    2015:
      - HLT_e24_lhmedium_L1EM20VH || HLT_e60_lhmedium || HLT_e120_lhloose
      - HLT_mu20_iloose_L1MU15 || HLT_mu40
      - HLT_2g20_tight
    2016:
      - HLT_e26_lhtight_nod0_ivarloose || HLT_e60_lhmedium_nod0 || HLT_e140_lhloose_nod0
      - HLT_mu26_ivarmedium || HLT_mu50
      - HLT_g35_loose_g25_loose
    2017:
      - HLT_e26_lhtight_nod0_ivarloose || HLT_e60_lhmedium_nod0 || HLT_e140_lhloose_nod0
      - HLT_2g22_tight_L12EM15VHI
      - "HLT_mu50"
    2018:
      - HLT_e26_lhtight_nod0_ivarloose || HLT_e60_lhmedium_nod0 || HLT_e140_lhloose_nod0
      - HLT_g35_medium_g25_medium_L12EM20VH
      - HLT_mu26_ivarmedium
      - HLT_2mu14
  triggerMatchingChainsPerYear:
    2015:
      - HLT_e24_lhmedium_L1EM20VH || HLT_e60_lhmedium || HLT_e120_lhloose
      - HLT_mu20_iloose_L1MU15 || HLT_mu40
      - HLT_2g20_tight
    2016:
      - HLT_e26_lhtight_nod0_ivarloose || HLT_e60_lhmedium_nod0 || HLT_e140_lhloose_nod0
      - HLT_mu26_ivarmedium || HLT_mu50
      - HLT_g35_loose_g25_loose
    2017:
      - HLT_e26_lhtight_nod0_ivarloose || HLT_e60_lhmedium_nod0 || HLT_e140_lhloose_nod0
      - HLT_2g22_tight_L12EM15VHI
      - "HLT_mu50"
    2018:
      - HLT_e26_lhtight_nod0_ivarloose || HLT_e60_lhmedium_nod0 || HLT_e140_lhloose_nod0
      - HLT_g35_medium_g25_medium_L12EM20VH
      - HLT_mu26_ivarmedium
      - HLT_2mu14
  noFilter: True
  electrons: AnaElectrons.loose
  photons: AnaPhotons.tight
  muons: AnaMuons.medium
  taus: AnaTauJets.tight
  electronID: Tight
  electronIsol: Tight_VarRad
  photonIsol: TightCaloOnly
  muonID: Tight

LeptonSF:
  # electrons: AnaElectrons.loose
  muons: AnaMuons.medium
  photons: AnaPhotons.tight
  lepton_postfix: nominal

Bootstraps:
  nReplicas: 2000
  skipOnMC: False

# After configuring each container, many variables will be saved automatically.
Output:
  treeName: analysis
  vars: []
  metVars: []
  containers:
    # Format should follow: <suffix>:<output container>
    mu_: OutMuons
    el_: OutElectrons
    ph_: OutPhotons
    tau_: OutTauJets
    jet_: OutJets
    larger_jet_: OutLargeRJets
    met_: AnaMET
    "": EventInfo
