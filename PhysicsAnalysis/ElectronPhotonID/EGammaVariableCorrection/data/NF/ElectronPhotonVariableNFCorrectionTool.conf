# This is a configuration file to be read via TEnv
# The configuration file is for ElectronPhotonVariableNFCorrectionTool

# ForwardModel: /atlas/kazakova/NFAthenaImplementationNEW/easyjet/athena/PhysicsAnalysis/ElectronPhotonID/EGammaVariableCorrection/data/NF/fold0/best_model_forward_new.onnx
# BackwardModel: /atlas/kazakova/NFAthenaImplementationNEW/easyjet/athena/PhysicsAnalysis/ElectronPhotonID/EGammaVariableCorrection/data/NF/fold0/best_model_backward_new.onnx

# FS or AF3
SimulationType: FS

# Depends on number of provided models
NFolds: 2

# Pattern for models path
ONNXnamePattern: /atlas/kazakova/NFAthenaImplementationNEW/easyjet/athena/PhysicsAnalysis/ElectronPhotonID/EGammaVariableCorrection/data/NF/models_allvars/PhotonNFModelForShowerShapes

# Choosing of folds strategy:
# eventNumber strategy: eventNumber % NFolds
# eventNumber_pT strategy: ( eventNumber + floor(pT) ) % NFolds
FoldStrategy: eventNumber

# Cuts on shower shapes to remove default values: 1 or 0
ApplyShowerShapeCuts: 1

