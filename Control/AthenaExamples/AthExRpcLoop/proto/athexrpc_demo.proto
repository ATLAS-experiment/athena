//
// The demonstration fragment's own payload schema.
//
// Deliberately a *second* file, and deliberately not imported by athrpc.proto.
// The framework's envelope knows that a payload is bytes with an encoding and a
// schema name; it does not know these messages exist, and nothing in
// Control/AthenaExamples/AthExRpcLoop outside src/demo/ mentions them. That is
// the property being demonstrated: a fragment publishes its own schema and
// ships the algorithms that convert it, so adding a workload costs no change to
// the transport, the loop manager, the gate or the pack algorithm.
//
// A real fragment would put its actual EDM here -- clusters, hits, a
// structure-of-arrays a device produced. These two messages carry integers and
// doubles because the algorithms behind this boundary add numbers together.

syntax = "proto3";

package athexrpc.demo.v1;

// A set of named integers.
//
// Named rather than positional so that the codec maps entries onto StoreGate
// keys by name: a fragment that gains an input does not silently reinterpret
// the ones it already had.
message Ints {
  message Entry {
    string name  = 1;
    int64  value = 2;
  }
  repeated Entry entry = 1;
}

// One named vector of doubles.
message Doubles {
  string name = 1;
  repeated double value = 2;
}
