model: &Model
    model_name: hgm-mc23-85e5-2e6-5e6
    onnx_path: CaloClusterCorrection/hgm_mc23_85e5-2e6-5e6.onnx
    
    init_args:
        init_args: 
        num_layers: 4
        layers: [ 64, 64, 64, 64 ]
        layers_activation: [ ReLU, ReLU, ReLU, ReLU ]
        num_mixtures: &NumMixtures 3
        num_nodes: 64
        activation: ReLU 
        in_names: [features, layer0, activation1, layer1, activation2, layer2, activation3, layer3, activation4, layer4]
        
    train_args:
        loss_function: Heteroscedastic Gaussian mixture  
        optimizer: Adam
        num_epochs: 150
        batch_size_trn: 4096
        batch_size_tst: 512
        learning_rate: 0.0001
        lr_milestones: [25, 100]
        val_every: 2
        save_every: 25
        weight_decay: 0

    data_args:
        mc_release: mc23
        data_size_trn: 8500000
        data_size_val: 2000000
        data_size_tst: 5000000
        batch_idxs: []
    output:
        mus:
            trained_name: means
            description: Means of the Gaussian Mixture (log10 space)
            shape: *NumMixtures
        sigmas:
            trained_name: sigmas
            converters: [Exponential]
            description: Standard deviations of the Gaussian Mixture (log10 space)
            shape: *NumMixtures
        alphas:
            trained_name: alphas
            description: Weights of the Gaussian Mixture
            shape: *NumMixtures

   
    prediction:
        mode:
            name: mode with max LH
            name_class: HGMPrediction
            postprocessing: [MeanValueFromLogMean]
            scan: Linear
            range_fractions: [0.9,1.1]
            nstep: 1000
        sigma_syst:
            name: systematic uncertainty prediction
            name_class: HGMPrediction
            postprocessing: [StdDevFromLogVariance]
