      position: 2
      preprocessing: 
        processors: [ LogTenStandard ]
        parameters: [ 0, 0, 0.7883709531312437, 0.47747859619047434 ]
        shapes:     [ 4 ]     
    cluster_time:
      trained_name: t_ems
